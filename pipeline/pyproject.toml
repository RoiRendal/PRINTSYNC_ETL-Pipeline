[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psync-extract"
version = "0.1.0"
description = "PRINTSYNC nightly analytics batch pipeline - Stage 1 (Extract) and Stage 2 (Transform). Stage 1 reads one business day from PRINTSYNC over a read-only connection into the pipeline's own psync_analytics database; Stage 2 turns that handover into the dimensional tables the Load stage publishes. The distribution keeps its original name: renaming it would force a reinstall in every environment for no functional gain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Prefect is a convenience wrapper, not a requirement: both stages run from the command line with
# nothing but Psycopg, and the project's constraints rule out an orchestration framework in the
# pipeline itself. Keeping it out of `dependencies` makes the base install match that constraint
# instead of merely appearing to. Install it only to schedule runs:
#     pip install -e ".[orchestration]"
orchestration = ["prefect>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
