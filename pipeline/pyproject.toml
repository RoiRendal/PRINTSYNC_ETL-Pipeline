[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psync-extract"
version = "0.1.0"
description = "PRINTSYNC nightly analytics batch pipeline - Stage 1 (Extract). Reads one business day from PRINTSYNC over a read-only connection and writes it into the pipeline's own psync_analytics database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "prefect>=3.0",
    "pydantic-settings>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
